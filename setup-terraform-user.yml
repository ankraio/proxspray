---
# Standalone playbook to create terraform user and API token
# Usage: ansible-playbook -i inventory/my-cluster/inventory setup-terraform-user.yml --ask-vault-pass --extra-vars "proxmox_api_password=YOUR_ROOT_PASSWORD"
# terraform_user_password must be set (group_vars, vault, or --extra-vars);
# the role fails fast if it is missing.

- name: Setup Terraform User and API Token in Proxmox
  hosts: proxmox
  gather_facts: true

  tasks:
    - name: Include proxmox_terraform role
      include_role:
        name: proxmox_terraform
      tags: proxmox_terraform
